name: Regenerar imágenes Unidad III

on:
  push:
    branches:
      - main
    paths:
      - 'ejercicio1_casa.py'
      - 'ejercicio2_roseta.py'
      - '.github/workflows/regenerar-imagenes-unidad3.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install pillow

      - name: Regenerar imágenes
        run: |
          python ejercicio1_casa.py
          python ejercicio2_roseta.py

      - name: Publicar PNG actualizados
        run: |
          git config user.name "alansosa503"
          git config user.email "alansosa503@gmail.com"
          git add casa.png roseta.png roseta_12.png roseta_24.png roseta_36.png
          if git diff --cached --quiet; then
            echo "No hubo cambios en las imágenes."
          else
            git commit -m "Regenerar imágenes de la Unidad III"
            git push
          fi
